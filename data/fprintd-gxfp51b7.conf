[Service]
Environment=FP_GXFP51B7_DEVICE=/dev/goodix_bios_sealed
# Enclave RPC connects to the same-machine guest over loopback SSH.
PrivateNetwork=false
RestrictAddressFamilies=
RestrictAddressFamilies=AF_UNIX AF_LOCAL AF_NETLINK AF_INET
ReadWritePaths=/proc/acpi/call /run/lock
UMask=0077
LimitCORE=0
