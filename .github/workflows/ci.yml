name: Quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.99.0
          components: rustfmt, clippy
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libglib2.0-dev pkg-config libfprint-2-tod-dev
      - run: python -m pip install -r requirements-tools.txt
      - run: cargo install cargo-machete --version 0.9.2 --locked
      - run: make check PYTHON=python
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: make audit
