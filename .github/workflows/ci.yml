name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopencv-dev libglib2.0-dev libclang-dev pkg-config libfprint-2-tod-dev
      - run: python -m pip install -r requirements-tools.txt
      - run: make check fprint PYTHON=python
  minimum-rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev libopencv-dev libglib2.0-dev libclang-dev pkg-config libfprint-2-tod-dev
      - run: cargo check --workspace --locked
