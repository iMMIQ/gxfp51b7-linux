name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y libpam0g-dev
      - run: python -m pip install -r requirements-tools.txt
      - run: make check PYTHON=python
# CI never loads modules, starts a VM, captures fingerprints or modifies PAM.
