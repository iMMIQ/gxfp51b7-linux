[workspace]
members = ["crates/core", "crates/driver", "crates/pam", "crates/backends"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/gxfp51b7-linux"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
ndarray = "0.17"
ndarray-conv = "0.6"
ndarray-ndimage = "0.6"
ndarray-npy = "0.10"
nix = { version = "0.31", features = ["user", "fs", "signal", "process", "poll", "resource"] }
pam = { package = "pam-bindings", version = "0.3" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"
rustix = { version = "1", features = ["process"] }

[profile.release]
lto = "thin"
strip = true
