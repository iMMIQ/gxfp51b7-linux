[workspace]
members = ["crates/core", "crates/driver", "crates/backends"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.99"
license = "LGPL-3.0-or-later"
repository = "https://github.com/iMMIQ/gxfp51b7-linux"

[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ndarray = "0.17"
ndarray-npy = "0.10"
nix = { version = "0.31", features = ["user", "fs", "signal", "process", "poll", "resource"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
wait-timeout = "0.2"

[profile.release]
lto = "thin"
strip = true

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
